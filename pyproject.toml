[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loganalyzer"
version = "0.1.0"
description = "Log analiz CLI + Ollama yorumlama"
requires-python = ">=3.10"
dependencies = ["requests>=2.32"]

[project.scripts]
loganalyzer = "loganalyzer.cli:main"

[tool.setuptools.packages.find]
include = ["loganalyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Proje kokunu import yoluna ekle.
# "python -m pytest" bunu kendiliginden yapar, duz "pytest" YAPMAZ.
# CI duz "pytest" calistirdigi icin bu satir olmadan
# ModuleNotFoundError: No module named 'loganalyzer' aliniyor.
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["loganalyzer"]
