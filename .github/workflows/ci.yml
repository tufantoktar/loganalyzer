# GitHub Actions pipeline.
#
# .gitlab-ci.yml ile ayni isi yapar, sadece sozdizimi farkli.
# Karsilastirma icin ikisini de repoda birakmak ogretici.
#
# EK AYAR GEREKMEZ: GITHUB_TOKEN otomatik gelir, GHCR'a push icin yeterli.
# Tek yapman gereken repo Settings > Actions > General > Workflow permissions
# altinda "Read and write permissions" secili olsun (bir kereye mahsus).

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # --- 1. Kod kalitesi -------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bagimliliklari kur
        run: pip install -r requirements-dev.txt

      - name: Python lint (ruff)
        run: |
          ruff check loganalyzer tests
          ruff format --check loganalyzer tests

      - name: Bash lint (shellcheck)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck --severity=warning scripts/*.sh

      - name: Dockerfile lint (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008

  # --- 2. Testler ------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: pytest
        run: pytest -v --cov=loganalyzer --cov-report=term --cov-report=xml --junitxml=junit.xml

      - name: Smoke test (CLI uctan uca)
        run: |
          bash scripts/gen_sample_logs.sh sample_logs/ci.log 300
          python -m loganalyzer sample_logs/ci.log --no-llm -f json -o reports/ci-report.json
          python - <<'PY'
          import json
          d = json.load(open("reports/ci-report.json"))
          assert d["analysis"]["total_lines"] == 300, d["analysis"]["total_lines"]
          print("OK", d["analysis"]["level_counts"])
          PY

      - name: Test raporlarini yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            junit.xml
            coverage.xml
            reports/
          retention-days: 7

  # --- 3. Imaj build + GHCR push --------------------------------------------
  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # GHCR'a yazmak icin gerekli
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: GHCR'a giris yap
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # otomatik, elle eklemene gerek yok

      - name: Tag'leri hesapla
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (once sadece build, push yok)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: loganalyzer:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Imaj gercekten calisiyor mu?
        run: docker run --rm -e WAIT_FOR_OLLAMA=false loganalyzer:test --version

      # NOT: Bu action'in etiketleri 'v' onekli olmali. Onceden 0.28.0 gibi
      # oneksiz etiketler vardi; tedarik zinciri saldirisi sonrasi Aqua Security
      # tum etiketleri v-onekli hale getirdi ve eskilerini kaldirdi.
      # Oneksiz surum yazarsan "unable to find version" hatasi alirsin.
      - name: Guvenlik taramasi (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: loganalyzer:test
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"        # simdilik sadece raporla, build'i kirma
        # Tarayicinin kendi sorunu (CVE veritabani indirilemedi vb.) imaj
        # push'unu engellemesin. Guvenlik bilgisi degerli ama bloke edici degil.
        continue-on-error: true

      # Push sadece main veya tag'de. PR'larda push yok.
      - name: GHCR'a push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
